# HD Pro Webcam C920 (046d:082d) - spotter camera settings, by engine/camtune.py
# tuned 2026-11-24 on the rig (pistol card), against the camera's automatics:
#   sharpness 100 -> 436, edge fit 0.24 -> 0.14 px, rings 0.077 mm, geometry noise 0.0072 mm, contrast 172
# Focus depends on the camera-to-card distance, exposure on the light:
# re-run camtune.py after moving the camera or changing the lighting.
# One control=value per line, applied IN ORDER, one per v4l2-ctl call
# (an auto switch comes before the manual value it guards).
focus_automatic_continuous=0
focus_absolute=30
auto_exposure=1
exposure_dynamic_framerate=0
exposure_time_absolute=96
gain=0
white_balance_automatic=0
white_balance_temperature=6367
power_line_frequency=2
