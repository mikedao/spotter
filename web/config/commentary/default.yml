# The announcer's commentary in chatty mode: several phrasings per moment, one
# picked at random (Commentary). A personality is a file like this one.
#
# Each line is spoken as voice pieces: commas and full stops are pauses
# (voicelines.split). {n} {dir} {goal} {d} are filled in. Lines marked "then the
# total" are followed by the number as its own piece ("that's the card" ... "92").
# Letters, numbers, spaces and . , ' - only (no ! or ?: a voice piece can't hold
# them). Plain American English; nothing that sounds like a lecture.

name: Default
description: Friendly and brief - notices streaks, bests, patterns and pace.

streak_tens:           # 3 or more tens in a row ({n})
  - "{n} tens in a row"
  - "that's {n} straight tens"
  - "{n} tens, keep it going"
  - "ten after ten, that's {n}"
  - "{n} in a row in the ten"
  - "another ten, {n} straight"
  - "{n} tens running"
  - "you're on a roll, {n} tens"
  - "{n} tens, same again"
  - "that's {n} tens back to back"
